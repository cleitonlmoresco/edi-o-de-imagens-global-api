name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  server:
    name: Servidor (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22', '24']

    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Testes
        run: npm test

      - name: Auditoria de dependências de produção
        # O Expo CLI traz avisos altos em zod/node-forge sem correção compatível;
        # falhamos apenas em vulnerabilidades críticas.
        run: npm audit --omit=dev --audit-level=critical

  app:
    name: App (Expo Doctor)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Diagnóstico do Expo
        run: npx --yes expo-doctor
